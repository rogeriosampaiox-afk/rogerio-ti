name: Corrigir layout mobile

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/mobile-fix.yml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar correções mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          mobile_css = r'''
          /* ===== MOBILE 2.1 ===== */
          @media (max-width: 850px) {
            html, body { width:100%; max-width:100%; overflow-x:hidden; }
            .container { width:calc(100% - 28px); max-width:100%; }
            .top { display:none; }
            header { position:sticky; top:0; width:100%; z-index:9999; }
            .nav { min-height:64px; height:auto; padding:9px 0; gap:8px; flex-wrap:nowrap; }
            .logo { min-width:0; flex:1 1 auto; gap:8px; font-size:15px; line-height:1.05; }
            .logo-mark { width:36px; height:36px; min-width:36px; border-radius:9px; }
            .logo small { font-size:8px; letter-spacing:1.4px; margin-top:3px; white-space:nowrap; }
            header > .container > .btn { display:none; }
            .mobile-menu-btn { display:grid !important; place-items:center; width:42px; height:42px; min-width:42px; padding:0; border:1px solid #1b4e7d; background:#071525; color:#fff; border-radius:7px; font-size:22px; cursor:pointer; }
            nav.mobile-open { display:flex !important; position:absolute; left:14px; right:14px; top:62px; flex-direction:column; align-items:stretch; gap:0; padding:8px; background:#06111d; border:1px solid #18304b; border-radius:8px; box-shadow:0 15px 35px #000b; }
            nav.mobile-open a { padding:13px 12px; border-bottom:1px solid #13283e; font-size:13px; }
            nav.mobile-open a:last-child { border-bottom:0; }
            .hero { min-height:auto; padding:72px 0 55px; }
            .hero h1 { font-size:clamp(34px,9vw,46px); overflow-wrap:anywhere; word-break:normal; }
            .hero p, .section-head p, .card p, .project-body p, .step p, .contact-box p, .about p, .cta p { overflow-wrap:anywhere; word-break:normal; }
            .eyebrow { font-size:11px; letter-spacing:.8px; }
            .actions { margin:24px 0; }
            .stats { gap:18px; }
            section { padding:62px 0; }
            .section-head h2, .about h2 { font-size:30px; }
            .grid, .portfolio, .process, .footer-grid { grid-template-columns:1fr; }
            .card { min-height:auto; padding:23px 18px; }
            .about-grid, .contact-grid { grid-template-columns:1fr; gap:25px; }
            .profile { height:250px; }
            .checks { grid-template-columns:1fr; }
            .project-top { height:100px; }
            .contact-box { padding:22px 18px; }
            .cta { padding:38px 0; }
            .cta h2 { font-size:27px; }
            .cta-inner { text-align:center; }
            footer { padding:40px 0 22px; }
            .float-wa { width:56px; height:56px; right:14px; bottom:14px; }
          }
          @media (min-width: 851px) { .mobile-menu-btn { display:none !important; } }
          '''

          if '/* ===== MOBILE 2.1 ===== */' not in s:
              s = s.replace('</style>', mobile_css + '\n</style>', 1)

          # Add a compact hamburger button immediately before the desktop CTA.
          if '<button class="mobile-menu-btn"' not in s:
              needle = '<a class="btn primary" href="https://wa.me/5566996328178?text=Olá%20Rogério!%20Gostaria%20de%20solicitar%20um%20orçamento%20de%20TI." target="_blank">FALE COMIGO</a>'
              replacement = '<button class="mobile-menu-btn" type="button" aria-label="Abrir menu" aria-expanded="false" onclick="toggleMobileMenu()">☰</button>' + needle
              s = s.replace(needle, replacement, 1)

          js = r'''<script>
          function toggleMobileMenu(){
            const n=document.querySelector('header nav');
            const b=document.querySelector('.mobile-menu-btn');
            if(!n||!b)return;
            const open=n.classList.toggle('mobile-open');
            b.setAttribute('aria-expanded',open?'true':'false');
            b.textContent=open?'✕':'☰';
          }
          document.addEventListener('click',function(e){
            const n=document.querySelector('header nav'), b=document.querySelector('.mobile-menu-btn');
            if(!n||!b||!n.classList.contains('mobile-open'))return;
            if(!n.contains(e.target)&&e.target!==b){n.classList.remove('mobile-open');b.textContent='☰';b.setAttribute('aria-expanded','false');}
            if(e.target.closest('header nav a')){n.classList.remove('mobile-open');b.textContent='☰';b.setAttribute('aria-expanded','false');}
          });
          </script>'''
          if 'function toggleMobileMenu()' not in s:
              s = s.replace('</body>', js + '\n</body>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit correção
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: responsividade e menu mobile [skip ci]'
          git push
